[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cgl-interagentmail"
version = "1.2.0"
description = "File-backed local mail, MCP tools, and push delivery for Codex project agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cerberus Game Labs" }]
keywords = ["codex", "mcp", "agents", "mailbox", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "mcp>=2.0,<3",
  "websockets>=14,<16",
]

[project.optional-dependencies]
release = [
  "build>=1.2,<2",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://cerberusgamelabs.xyz"
Repository = "https://github.com/cerberusgamelabs/cgl-interagentmail"
Documentation = "https://github.com/cerberusgamelabs/cgl-interagentmail/blob/main/docs/INSTALL.md"
Issues = "https://github.com/cerberusgamelabs/cgl-interagentmail/issues"
Changelog = "https://github.com/cerberusgamelabs/cgl-interagentmail/blob/main/CHANGELOG.md"

[project.scripts]
iam = "iam_orchestrator:main"
interagentmail = "interagentmail:main"
iam-mcp = "iam_mcp_server:main"
iam-codex-bridge = "iam_codex_bridge:main"

[tool.setuptools]
py-modules = ["interagentmail", "iam_service", "iam_mcp_server", "iam_codex_bridge", "iam_orchestrator"]
