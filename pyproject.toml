[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cgl-interagentmail"
version = "1.5.0"
description = "File-backed mail, MCP tools, push delivery, and authenticated browser messaging for Codex agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cerberus Game Labs" }]
keywords = ["codex", "mcp", "agents", "mailbox", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "mcp>=2.0,<3",
  "websockets>=14,<16",
  "cryptography>=49,<50",
]

[project.optional-dependencies]
release = [
  "build>=1.2,<2",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://cerberusgamelabs.xyz"
Repository = "https://github.com/cerberusgamelabs/cgl-interagentmail"
Documentation = "https://github.com/cerberusgamelabs/cgl-interagentmail/blob/main/docs/INSTALL.md"
Issues = "https://github.com/cerberusgamelabs/cgl-interagentmail/issues"
Changelog = "https://github.com/cerberusgamelabs/cgl-interagentmail/blob/main/CHANGELOG.md"

[project.scripts]
iam = "iam_orchestrator:main"
interagentmail = "interagentmail:main"
iam-mcp = "iam_mcp_server:main"
iam-codex-bridge = "iam_codex_bridge:main"

[tool.setuptools]
include-package-data = false
py-modules = ["interagentmail", "iam_service", "iam_mcp_server", "iam_codex_bridge", "iam_orchestrator", "iam_web", "iam_webconnect", "iam_hooks", "iam_heartbeat", "iam_fast_path", "iam_desktop", "iam_desktop_onboarding", "iam_desktop_controls", "iam_desktop_prompts", "iam_desktop_files", "iam_messenger_access", "iam_messenger_pairing", "iam_messenger_review", "iam_messenger_consent", "iam_messenger_friends", "iam_messenger_friend_delivery", "iam_messenger_keys", "iam_messenger_proof", "iam_messenger_connector", "iam_messenger_history", "iam_messenger_send", "iam_messenger_images", "iam_messenger_uploads", "iam_messenger_profiles", "iam_messenger_roster", "iam_messenger_reads", "iam_messenger_stream"]
packages = ["desktop"]

[tool.setuptools.package-data]
desktop = ["*.cjs", "*.json", "assets/*.png", "assets/*.ico", "public/*.html", "public/*.css", "public/*.js", "public/emoji/*.png", "public/emoji/*.txt"]

[tool.setuptools.exclude-package-data]
desktop = ["test/*", "node_modules/*"]
