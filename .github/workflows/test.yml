name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run Windows tests with read-only ACL diagnostics
        if: runner.os == 'Windows'
        shell: python
        run: |
          import csv
          import subprocess
          import unittest

          original_output = subprocess.check_output
          reported = set()

          def diagnostic_output(command, *args, **kwargs):
              result = original_output(command, *args, **kwargs)
              if isinstance(command, list) and command:
                  if command[:2] == ['whoami', '/user'] and 'sid' not in reported:
                      reported.add('sid')
                      sid = next(csv.reader([result.strip()]))[1]
                      print('Windows ACL diagnostic: current SID =', sid, flush=True)
                  if ('IAM_HOOK_ACL_PATH' in str(command[-1])
                          and 'sddl' not in reported):
                      reported.add('sddl')
                      print('Windows ACL diagnostic: returned SDDL =', repr(result), flush=True)
              return result

          subprocess.check_output = diagnostic_output
          try:
              unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'])
          finally:
              subprocess.check_output = original_output

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
